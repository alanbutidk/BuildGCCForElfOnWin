name: "Build Bit-Perfect x86_64 GLIBC GCC Toolchain"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-toolchain:
    runs-on: ubuntu-24.04

    env:
      TARGET: "x86_64-pc-linux-gnu"
      PREFIX: "/opt/cross-linux"

      BINUTILS_VER: "2.42"
      GCC_VER: "14.1.0"
      GLIBC_VER: "2.39"
      LINUX_VER: "6.8"

      FIXED_SEED: "msys2linuxreproducible"
      GLOBAL_CFLAGS: "-O2 -frandom-seed=msys2linuxreproducible -fno-guess-branch-probability"
      GLOBAL_CXXFLAGS: "-O2 -frandom-seed=msys2linuxreproducible -fno-guess-branch-probability"

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      # ---- Cache the FINAL built toolchain, keyed on all versions + flags ----
      # If this hits, we skip every build step below entirely.
      - name: "Cache built toolchain"
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.PREFIX }}
          key: toolchain-${{ runner.os }}-bu${{ env.BINUTILS_VER }}-gcc${{ env.GCC_VER }}-glibc${{ env.GLIBC_VER }}-linux${{ env.LINUX_VER }}-${{ env.FIXED_SEED }}-v3

      # ---- Cache downloaded+extracted sources separately ----
      # Useful even on a toolchain cache miss (e.g. you bump GCC_VER but not the others).
      - name: "Cache sources"
        id: cache-sources
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: src
          key: sources-bu${{ env.BINUTILS_VER }}-gcc${{ env.GCC_VER }}-glibc${{ env.GLIBC_VER }}-linux${{ env.LINUX_VER }}

      - name: "Install System Build Dependencies"
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git gawk bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev \
            wget ca-certificates xz-utils

      - name: "Create Build Directories"
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p ${{ env.PREFIX }}
          sudo chown -R $USER:$USER ${{ env.PREFIX }}
          mkdir -p src build/binutils build/gcc-stage1 build/glibc build/gcc-final

      - name: "Download Component Sources"
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.cache-sources.outputs.cache-hit != 'true'
        run: |
          cd src
          wget -q "https://ftp.gnu.org/gnu/binutils/binutils-${{ env.BINUTILS_VER }}.tar.xz"
          wget -q "https://ftp.gnu.org/gnu/gcc/gcc-${{ env.GCC_VER }}/gcc-${{ env.GCC_VER }}.tar.xz"
          wget -q "https://ftp.gnu.org/gnu/glibc/glibc-${{ env.GLIBC_VER }}.tar.xz"
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${{ env.LINUX_VER }}.tar.xz"

          tar -xf binutils-${{ env.BINUTILS_VER }}.tar.xz
          tar -xf gcc-${{ env.GCC_VER }}.tar.xz
          tar -xf glibc-${{ env.GLIBC_VER }}.tar.xz
          tar -xf linux-${{ env.LINUX_VER }}.tar.xz

          # GCC needs its prerequisite libs (gmp/mpfr/mpc/isl) - download once, cached with src
          cd gcc-${{ env.GCC_VER }}
          ./contrib/download_prerequisites

      - name: "Install Linux Kernel Headers"
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd src/linux-${{ env.LINUX_VER }}
          make headers_install ARCH=x86_64 INSTALL_HDR_PATH=${{ env.PREFIX }}/${{ env.TARGET }}/usr

      - name: "Build GNU Binutils (Deterministic)"
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd build/binutils
          export CFLAGS="${{ env.GLOBAL_CFLAGS }}"
          export CXXFLAGS="${{ env.GLOBAL_CXXFLAGS }}"
          ../../src/binutils-${{ env.BINUTILS_VER }}/configure \
            --target=${{ env.TARGET }} \
            --prefix=${{ env.PREFIX }} \
            --with-sysroot=${{ env.PREFIX }}/${{ env.TARGET }} \
            --enable-deterministic-archives \
            --disable-nls \
            --disable-werror
          make -j$(nproc)
          make install

      # ---- Stage 1 is a freestanding, headers-less C-only bootstrap compiler. ----
      # It must be C-only (no C++: libstdc++ needs a target libc that doesn't exist
      # yet), and all-gcc/install-gcc must fully finish and be on PATH *before*
      # all-target-libgcc's own configure runs against it - building them in one
      # combined parallel `make` step is unreliable and was the actual cause of
      # "configure: error: cannot compute suffix of object files: cannot compile".
      - name: "Build GCC Stage 1 (Bootstrap)"
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          export PATH="${{ env.PREFIX }}/bin:$PATH"
          cd build/gcc-stage1
          export CFLAGS="${{ env.GLOBAL_CFLAGS }}"
          export CXXFLAGS="${{ env.GLOBAL_CXXFLAGS }}"
          ../../src/gcc-${{ env.GCC_VER }}/configure \
            --target=${{ env.TARGET }} \
            --prefix=${{ env.PREFIX }} \
            --with-sysroot=${{ env.PREFIX }}/${{ env.TARGET }} \
            --enable-languages=c \
            --disable-shared \
            --disable-threads \
            --disable-libssp \
            --disable-libquadmath \
            --disable-libgomp \
            --disable-libatomic \
            --without-headers \
            --disable-multilib \
            --enable-deterministic-archives
          make -j$(nproc) all-gcc
          make install-gcc
          make -j$(nproc) all-target-libgcc
          make install-target-libgcc

      - name: "Build GLIBC"
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          export PATH="${{ env.PREFIX }}/bin:$PATH"
          cd build/glibc
          export CFLAGS="${{ env.GLOBAL_CFLAGS }}"
          export CXXFLAGS="${{ env.GLOBAL_CXXFLAGS }}"
          ../../src/glibc-${{ env.GLIBC_VER }}/configure \
            --target=${{ env.TARGET }} \
            --host=${{ env.TARGET }} \
            --build=$(../../src/glibc-${{ env.GLIBC_VER }}/scripts/config.guess) \
            --prefix=/usr \
            --with-headers=${{ env.PREFIX }}/${{ env.TARGET }}/usr/include \
            libc_cv_forced_unwind=yes
          make -j$(nproc)
          make install_root=${{ env.PREFIX }}/${{ env.TARGET }} install

      - name: "Build Final GCC Stage 2"
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          export PATH="${{ env.PREFIX }}/bin:$PATH"
          cd build/gcc-final
          export CFLAGS="${{ env.GLOBAL_CFLAGS }}"
          export CXXFLAGS="${{ env.GLOBAL_CXXFLAGS }}"
          ../../src/gcc-${{ env.GCC_VER }}/configure \
            --target=${{ env.TARGET }} \
            --prefix=${{ env.PREFIX }} \
            --with-sysroot=${{ env.PREFIX }}/${{ env.TARGET }} \
            --enable-languages=c,c++ \
            --enable-shared \
            --enable-threads=posix \
            --disable-multilib \
            --enable-deterministic-archives \
            --disable-nls \
            --disable-werror
          make -j$(nproc)
          make install

      # ---- Runs on ANY prior failure too, so a failed build still gives you ----
      # a downloadable zip of every config.log plus the build tree layout,
      # instead of having to copy/paste terminal output back and forth.
      - name: "Collect debug logs on failure"
        if: failure()
        run: |
          mkdir -p /tmp/debug-logs
          find build -name 'config.log' -print0 \
            | tar --null -czf /tmp/debug-logs/config-logs.tar.gz --files-from=-
          find build -maxdepth 3 -type d > /tmp/debug-logs/build-tree.txt
          ( cd /tmp/debug-logs && zip -r failure-logs.zip config-logs.tar.gz build-tree.txt )

      - name: "Upload debug logs on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-debug-logs
          path: /tmp/debug-logs/failure-logs.zip
          if-no-files-found: warn
          retention-days: 7

      - name: "Verify Artifact Determinism"
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          export PATH="${{ env.PREFIX }}/bin:$PATH"
          echo "int main(){ return 0; }" > test.c

          ${{ env.TARGET }}-gcc -O2 -frandom-seed=${{ env.FIXED_SEED }} -ffile-prefix-map=$(pwd)=. -Wl,--build-id=none test.c -o output1.bin
          ${{ env.TARGET }}-gcc -O2 -frandom-seed=${{ env.FIXED_SEED }} -ffile-prefix-map=$(pwd)=. -Wl,--build-id=none test.c -o output2.bin

          sha256sum output1.bin
          sha256sum output2.bin

          cmp --silent output1.bin output2.bin && echo "SUCCESS: Bit-perfect match achieved!" || (echo "ERROR: Mismatched hashes" && exit 1)

      - name: "Package Toolchain Artifact"
        run: |
          tar -czf x86_64-glibc-linux-toolchain.tar.gz -C "$(dirname ${{ env.PREFIX }})" "$(basename ${{ env.PREFIX }})"

      - name: "Upload Toolchain"
        uses: actions/upload-artifact@v4
        with:
          name: bit-perfect-linux-toolchain
          path: x86_64-glibc-linux-toolchain.tar.gz
          if-no-files-found: error